name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3-pip openjdk-17-jdk \
            unzip zlib1g-dev libncurses5-dev ccache libssl-dev

      - name: Install buildozer & cython
        # kivy 2.3.1 的 Android recipe 需要 cython 0.29.x（不是 3.x）
        run: |
          pip install --upgrade pip
          pip install "cython==0.29.36" buildozer

      - name: Download CJK font (pure TrueType, Kivy/SDL2-safe)
        # 必须是纯 TrueType (.ttf glyf)，Kivy/SDL2 才能稳定渲染中文；
        # OTF(CFF)/TTC 在安卓上加载不稳 → 中文乱码 + 动态文字控件重建时崩溃闪退。
        # 用 header 自校验：只接受 sfnt 版本 0x00010000 或 "true"，拒绝 OTTO(CFF)/ttcf(TTC)。
        run: |
          set -euo pipefail
          mkdir -p fonts
          rm -f fonts/msyh.ttf
          is_pure_ttf() {
            local h
            h=$(head -c4 "$1" | od -An -tx1 | tr -d ' \n')
            [[ "$h" == "00010000" || "$h" == "74727565" ]]
          }
          URLS=(
            "https://raw.githubusercontent.com/StellarCN/scp_zh/master/fonts/SimHei.ttf"
            "https://raw.githubusercontent.com/StellarCN/scp_zh/master/fonts/SimSun.ttf"
            "https://raw.githubusercontent.com/StellarCN/scp_zh/master/fonts/SimKai.ttf"
          )
          for url in "${URLS[@]}"; do
            tmp=$(mktemp --suffix=.ttf)
            if curl -fL --retry 3 -o "$tmp" "$url" && is_pure_ttf "$tmp"; then
              cp "$tmp" fonts/msyh.ttf
              echo "OK: used $url"
              rm -f "$tmp"
              break
            fi
            echo "skip: $url (download failed or not pure TrueType)"
            rm -f "$tmp"
          done
          if [[ ! -f fonts/msyh.ttf ]]; then
            echo "ERROR: no valid pure-TTF CJK font downloaded"; exit 1
          fi
          ls -la fonts/
          echo "font sfnt header:"; head -c4 fonts/msyh.ttf | od -An -tx1

      - name: Build APK (debug)
        run: buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xingce-mobile-apk
          path: bin/*.apk
          if-no-files-found: error
