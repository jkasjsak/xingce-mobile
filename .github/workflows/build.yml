name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3 python3-pip openjdk-17-jdk \
            unzip zip zlib1g-dev libncurses5-dev libssl-dev libffi-dev libltdl-dev \
            libsqlite3-dev automake autoconf libtool pkg-config ccache patch bison gettext

      - name: Set up Android SDK (licenses accepted)
        uses: android-actions/setup-android@v3

      - name: Install Android platform / build-tools
        run: |
          sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Install buildozer & cython
        run: |
          pip install --upgrade pip
          pip install "cython==0.29.36" buildozer

      - name: Point buildozer at pre-installed SDK
        run: |
          sed -i "s|^android.sdk_path = .*|android.sdk_path = $ANDROID_HOME|" buildozer.spec
          grep android.sdk_path buildozer.spec

      - name: Fix legacy sdkmanager for JDK 17
        run: |
          MODERN=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          printf '#!/bin/sh\nexec "%s" "$@"\n' "$MODERN" > "$ANDROID_HOME/tools/bin/sdkmanager"
          chmod +x "$ANDROID_HOME/tools/bin/sdkmanager"
          "$ANDROID_HOME/tools/bin/sdkmanager" --version

      - name: Download CJK font (charts need Chinese glyphs)
        run: |
          mkdir -p fonts
          curl -fL -o fonts/msyh.ttf "https://github.com/anthonyfok/fonts-wqy-microhei/raw/master/wqy-microhei.ttc" || curl -fL -o fonts/msyh.ttf "https://github.com/StellarCN/scp_zh/raw/master/fonts/SourceHanSansSC-Regular.otf"
          ls -la fonts/

      - name: Build APK (debug)
        run: buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xingce-mobile-apk
          path: bin/*.apk
          if-no-files-found: error
