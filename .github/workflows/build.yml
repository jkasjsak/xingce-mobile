name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3-pip openjdk-17-jdk \
            unzip zlib1g-dev libncurses5-dev ccache libssl-dev

      - name: Install buildozer & cython
        # kivy 2.3.1 的 Android recipe 需要 cython 0.29.x（不是 3.x）
        run: |
          pip install --upgrade pip
          pip install "cython==0.29.36" buildozer

      - name: Download CJK font (pure TTF, Kivy-friendly)
        # 必须是纯 TrueType (.ttf glyf)，Kivy/SDL2 才能稳定加载中文；
        # OTF(CFF)/TTC 在安卓上加载不稳，会导致中文乱码、且动态重建的文字控件渲染时崩溃闪退。
        run: |
          mkdir -p fonts
          rm -f fonts/msyh.ttf
          curl -fL -o fonts/msyh.ttf "https://github.com/anthonyfok/fonts-wqy-zenhei/raw/master/wqy-zenhei.ttf" \
            || curl -fL -o fonts/msyh.ttf "https://github.com/layerssss/wqy/raw/master/wqy-zenhei.ttf" \
            || curl -fL -o fonts/msyh.ttf "https://github.com/StellarCN/scp_zh/raw/master/fonts/SourceHanSansSC-Regular.otf"
          ls -la fonts/
          echo "font header:"; head -c4 fonts/msyh.ttf | xxd | head -1

      - name: Build APK (debug)
        run: buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xingce-mobile-apk
          path: bin/*.apk
          if-no-files-found: error
